<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6F86FF"/>
      <stop offset="1" stop-color="#3A2BC4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wallLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FE0C8"/>
      <stop offset="1" stop-color="#1E6BFF"/>
    </linearGradient>
    <linearGradient id="wallRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF4F8B"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2D45"/>
      <stop offset="1" stop-color="#14162A"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9ECFF"/>
      <stop offset="1" stop-color="#B9C0F2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#120A5C" flood-opacity="0.45"/>
    </filter>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- Icon body -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <!-- Two displays, each with its own dock -->
  <g clip-path="url(#body)">
    <g filter="url(#soft)">
      <!-- Left display -->
      <rect x="352" y="644" width="40" height="66" fill="url(#stand)"/>
      <rect x="292" y="700" width="160" height="22" rx="11" fill="url(#stand)"/>
      <rect x="152" y="318" width="360" height="336" rx="40" fill="url(#bezel)"/>
      <!-- Right display -->
      <rect x="632" y="644" width="40" height="66" fill="url(#stand)"/>
      <rect x="572" y="700" width="160" height="22" rx="11" fill="url(#stand)"/>
      <rect x="512" y="318" width="360" height="336" rx="40" fill="url(#bezel)"/>
    </g>

    <rect x="172" y="338" width="320" height="296" rx="22" fill="url(#wallLeft)"/>
    <rect x="532" y="338" width="320" height="296" rx="22" fill="url(#wallRight)"/>

    <!-- Seam between the two bezels -->
    <rect x="510" y="330" width="4" height="312" fill="#0B0C1A" opacity="0.6"/>

    <!-- Docks -->
    <rect x="212" y="548" width="240" height="64" rx="22" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="230" y="560" width="40" height="40" rx="11" fill="#3B82F6"/>
    <rect x="282" y="560" width="40" height="40" rx="11" fill="#22C55E"/>
    <rect x="334" y="560" width="40" height="40" rx="11" fill="#F59E0B"/>
    <rect x="386" y="560" width="40" height="40" rx="11" fill="#EF4444"/>

    <rect x="572" y="548" width="240" height="64" rx="22" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="590" y="560" width="40" height="40" rx="11" fill="#8B5CF6"/>
    <rect x="642" y="560" width="40" height="40" rx="11" fill="#06B6D4"/>
    <rect x="694" y="560" width="40" height="40" rx="11" fill="#EC4899"/>
    <rect x="746" y="560" width="40" height="40" rx="11" fill="#10B981"/>
  </g>
</svg>
